services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}

  ui:
    build:
      context: .
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      LABINSIGHT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
